services:
  app:
    # Built by GitHub Actions on every push to main; Portainer only pulls it.
    image: ghcr.io/baptistebergmann/popcorn:latest
    pull_policy: always
    container_name: popcorn
    restart: unless-stopped
    ports:
      - "8787:8787"
    mem_limit: 256m
    environment:
      APP_TOKEN: ${APP_TOKEN}
      # Optional: leave unset to keep MCP sign-in disabled.
      MCP_CONNECT_CODE: ${MCP_CONNECT_CODE:-}
      TMDB_API_TOKEN: ${TMDB_API_TOKEN}
      SITE_URL: ${SITE_URL}
    volumes:
      - popcorn-data:/data

volumes:
  popcorn-data:
